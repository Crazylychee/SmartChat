spring:
  netty:
    leak-detection: paranoid

############################### Turms ###############################

turms:
  cluster:
    connection:
      server:
        port-auto-increment: true
    shared-config:
      mongo:
        uri: ${MONGODB_URL2}
  logging:
    console:
      enabled: true
  plugin:
    js:
      debug:
        enabled: true
  service:
    admin-api:
      debug:
        enabled: true
    client-api:
      logging:
        included-notification-categories:
          - category: all
    fake:
      enabled: true
    message:
      check-if-target-active-and-not-deleted: false
      use-conversation-id: true
    mongo:
      admin:
        uri: ${MONGODB_URL2}
      user:
        uri: ${MONGODB_URL2}
      group:
        uri: ${MONGODB_URL2}
      conversation:
        uri: ${MONGODB_URL2}
      message:
        uri: ${MONGODB_URL2}
        tiered-storage:
          enabled: true
          tiers:
            hot:
              days: 30
              shards:
                - rs_shard1
            warm:
              days: 60
              shards:
                - rs_shard1
            cold:
              days: 270
              shards:
                - rs_shard1
            frozen:
              shards:
                - rs_shard1
turms-plugin:
  minio:
    retry:
      enabled: false
